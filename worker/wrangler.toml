name = "ai-voice-bot"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "voicebot.devmohan.in", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "ai-voice-bot-db"
database_id = "9f95be6d-0023-4360-8baa-2648add6eaf8"

# Application config (`app_config`) + portfolio knowledge (`context`) are synced into this
# namespace at deploy time — see ../config/STORAGE.md and `node scripts/sync-config.mjs`.
# Only the namespace id lives here; content is never committed.
[[kv_namespaces]]
binding = "PORTFOLIO_KV"
id = "0ac98a2a6f5f428aafa4dd9e1d3f2feb"

# Email notifications on new leads use Resend (not Cloudflare Email Sending, which is
# gated behind the Workers Paid plan) — set RESEND_API_KEY, LEAD_NOTIFY_FROM, and
# LEAD_NOTIFY_TO as secrets via `wrangler secret put`. All optional; leads still save to
# D1 without them, just without an email ping.

[vars]
# Application SoT (persona, allowlist, knowledge) is synced into PORTFOLIO_KV
# (`app_config` + `context`) — do not commit personal site config here.
# See ../config/STORAGE.md and `node scripts/sync-config.mjs`.
#
# ALLOWED_ORIGINS is intentionally NOT set here: it is per-deployment, not per-repo.
# Origin enforcement fails CLOSED, so until `app_config` is synced (or ALLOWED_ORIGINS is
# set as a Worker var in the Cloudflare dashboard) every browser request gets a 403.
# `GET /health` reports `"config":"bootstrap","origins":0` in exactly that state.
#
# MODE is env-only on purpose. It is the master enforcement switch, and KV `app_config`
# is not allowed to override it — see applyKvAppConfig in src/config.ts.
DEFAULT_PROVIDER = "groq"
MAX_MESSAGE_CHARS = "2000"
MAX_TURNS_PER_SESSION = "30"
MODE = "prod"
TTS_VOICE = "hannah"
MAX_TTS_CHARS = "1200"

[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

# SQLite-backed DO => eligible on the Cloudflare free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

